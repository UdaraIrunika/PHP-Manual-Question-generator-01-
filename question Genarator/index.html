<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Cybersecurity Quiz</h1>
        <div id="questionBox">
            <p id="question">Click the button to generate a question!</p>
            <div id="choices" style="display: none;">
                <button id="choiceA" class="choice">Choice A</button>
                <button id="choiceB" class="choice">Choice B</button>
                <button id="choiceC" class="choice">Choice C</button>
                <button id="choiceD" class="choice">Choice D</button>
            </div>
        </div>
        <button id="generateButton">Generate Question</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
